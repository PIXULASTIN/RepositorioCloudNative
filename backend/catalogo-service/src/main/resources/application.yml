server:
  port: 8082

spring:
  application:
    name: catalogo-service

  # ---- Base de datos PostgreSQL ----
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catalogo360}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:CAMBIA-ESTA-CONTRASENA}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/TU-TENANT-ID/v2.0
