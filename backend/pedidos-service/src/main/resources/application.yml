server:
  port: 8081

spring:
  application:
    name: pedidos-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidos360}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/72e6a071-a2c0-48df-8b97-67eee4989d88/v2.0
        
  service:
    catalogo:
      url: ${SERVICE_CATALOGO_URL:http://localhost:8082}

  # ---------- EP3: RabbitMQ ----------
  rabbitmq:
    # En cloud: RABBITMQ_ADDRESSES=rabbit1:5672,rabbit2:5672 (clúster de 2 nodos)
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual        # el consumer hace ACK/NACK explicito
        default-requeue-rejected: false # un rechazo va a la DLQ, no vuelve a la cola
        prefetch: 10

# Nombres de exchanges, colas y routing keys: UN solo lugar (IE3.1).
# Los usan RabbitTopologyConfig (beans), el productor y los consumers.
app:
  rabbit:
    exchanges:
      direct: pedidos.direct
      topic: pedidos.topic
      dlx: pedidos.dlx
    queues:
      aceptados: pedidos.aceptados.queue
      despachos: pedidos.despachos.queue
      notificaciones: pedidos.notificaciones.queue
    routing-keys:
      aceptado: pedido.aceptado
      despachado: pedido.despachado
      notificaciones: pedido.*       # binding del topic exchange
    dlq-suffix: .dlq
