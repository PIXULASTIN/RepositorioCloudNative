server:
  port: 8081

spring:
  application:
    name: pedidos-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidos360}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:native123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ---- Validacion de JWT contra Entra ID ----
  security:
    oauth2:
      resourceserver:
        jwt:
          # Reemplaza TU-TENANT-ID por el Tenant ID (Directory ID) de tu propio
          # tenant de Azure AD / Entra ID (el que creaste con tu cuenta personal)
          issuer-uri: https://login.microsoftonline.com/TU-TENANT-ID/v2.0
