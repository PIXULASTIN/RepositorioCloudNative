server:
  port: 8081

spring:
  application:
    name: pedidos-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidos360}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/72e6a071-a2c0-48df-8b97-67eee4989d88/v2.0
        
  service:
    catalogo:
      url: ${SERVICE_CATALOGO_URL:http://localhost:8082}

  # ---------- EP3: RabbitMQ ----------
  rabbitmq:
    # En cloud: RABBITMQ_ADDRESSES=rabbit1:5672,rabbit2:5672 (clúster de 2 nodos)
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual        # el consumer hace ACK/NACK explicito
        default-requeue-rejected: false # un rechazo va a la DLQ, no vuelve a la cola
        prefetch: 10

# Nombres de exchanges, colas y routing keys: UN solo lugar (IE3.1).
# Los usan RabbitTopologyConfig (beans), el productor y los consumers.
app:
  rabbit:
    exchanges:
      direct: pedidos.direct
      topic: pedidos.topic
      dlx: pedidos.dlx
    queues:
      aceptados: pedidos.aceptados.queue
      despachos: pedidos.despachos.queue
      notificaciones: pedidos.notificaciones.queue
    routing-keys:
      aceptado: pedido.aceptado
      despachado: pedido.despachado
      notificaciones: pedido.*       # binding del topic exchange
    dlq-suffix: .dlq

  # ---------- EP5: Apache Kafka ----------
  # Un solo lugar para bootstrap, topicos y propiedades del productor.
  # Local (IDE):  localhost:9092,9093,9094   |  Docker: kafka1:29092,kafka2:29093,kafka3:29094
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    create-topics: ${KAFKA_CREATE_TOPICS:true}   # false = no intenta crear topicos al arrancar
    topics:
      pedidos:
        name: pedidos.eventos
        partitions: 3
        replicas: 3
        retention-ms: 604800000       # 7 dias
        cleanup-policy: delete
        min-insync-replicas: 2
      stock:
        name: catalogo.stock
        partitions: 3
        replicas: 3
        retention-ms: 0               # 0 = no se define (compact conserva el ultimo valor por key)
        cleanup-policy: compact
        min-insync-replicas: 2
    producer:
      acks: all                       # espera confirmacion de todas las replicas en sincronia
      retries: 3
      enable-idempotence: true        # evita duplicados por reintentos
      linger-ms: 5
      request-timeout-ms: 15000
      delivery-timeout-ms: 30000
      max-block-ms: 3000              # si Kafka no responde, send() falla rapido (no bloquea el pedido)
    consumer:
      auto-startup: ${KAFKA_CONSUMER_AUTO_STARTUP:true}   # false = no inicia los @KafkaListener
      auto-offset-reset: earliest
      concurrency: 1
      max-poll-records: 100
      groups:
        pedidos-stock: pedidos-stock    # consumer group de este servicio sobre catalogo.stock
      retry:                            # reintentos con backoff exponencial antes de enviar a la DLT
        initial-interval-ms: 1000
        multiplier: 2.0
        max-interval-ms: 5000
        max-retries: 3
  stock:
    umbral-bajo: 5                      # stock <= umbral genera alerta
