spring:
  datasource:
    url: jdbc:h2:mem:pedidos360test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    listener:
      simple:
        auto-startup: false

# EP5: en tests no se conecta a Kafka (no crea topicos al arrancar)
app:
  rabbit:
    exchanges:
      direct: pedidos.direct
      topic: pedidos.topic
      dlx: pedidos.dlx
    queues:
      aceptados: pedidos.aceptados.queue
      despachos: pedidos.despachos.queue
      notificaciones: pedidos.notificaciones.queue
    routing-keys:
      aceptado: pedido.aceptado
      despachado: pedido.despachado
      notificaciones: pedido.*
    dlq-suffix: .dlq
  kafka:
    bootstrap-servers: localhost:9092
    create-topics: false
    topics:
      pedidos:
        name: pedidos.eventos
        partitions: 3
        replicas: 3
        retention-ms: 604800000
        cleanup-policy: delete
        min-insync-replicas: 2
      stock:
        name: catalogo.stock
        partitions: 3
        replicas: 3
        retention-ms: 0
        cleanup-policy: compact
        min-insync-replicas: 2
    producer:
      acks: all
      retries: 3
      enable-idempotence: true
      linger-ms: 5
      request-timeout-ms: 15000
      delivery-timeout-ms: 30000
      max-block-ms: 3000
    consumer:
      auto-startup: false
      auto-offset-reset: earliest
      concurrency: 1
      max-poll-records: 100
      groups:
        pedidos-stock: pedidos-stock
      retry:
        initial-interval-ms: 100
        multiplier: 2.0
        max-interval-ms: 500
        max-retries: 2
  stock:
    umbral-bajo: 5