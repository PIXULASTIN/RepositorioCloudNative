# Uso en la EC2:  docker compose -f docker-compose.aws.yml --env-file .env up -d --build
# El archivo .env (NO se sube a GitHub) debe tener: DB_HOST, DB_USER, DB_PASSWORD
# y, opcionalmente, CORS_ORIGINS. Ver README.md
services:
  pedidos-service:
    build: ./backend/pedidos-service
    container_name: pedidos-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: pedidos360
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVICE_CATALOGO_URL: http://catalogo-service:8082
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}

  catalogo-service:
    build: ./backend/catalogo-service
    container_name: catalogo-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: catalogo360
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
