services:
  postgres:
    image: postgres:16
    container_name: pedidos360-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pedidos360
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"     
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: cookie-local-solo-desarrollo
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  rabbit-init:
    image: rabbitmq:3.13-management
    container_name: rabbit-init
    entrypoint: ["/bin/bash", "/init/init-cluster.sh"]
    environment:
      RABBIT_MAIN_NODE: rabbit@rabbitmq
      RABBITMQ_ERLANG_COOKIE: cookie-local-solo-desarrollo
    volumes:
      - ./rabbitmq/init-cluster.sh:/init/init-cluster.sh:ro
    depends_on:
      rabbitmq:
        condition: service_healthy

  pedidos-service:
    build: ./backend/pedidos-service
    container_name: pedidos-service
    ports:
      - "8081:8081"
    environment:
      RABBITMQ_ADDRESSES: rabbitmq:5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pedidos360
      DB_USER: postgres
      DB_PASSWORD: postgres
      SERVICE_CATALOGO_URL: http://catalogo-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  catalogo-service:
    build: ./backend/catalogo-service
    container_name: catalogo-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: catalogo360
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

  rabbit-admin-service:
    build: ./backend/rabbit-admin-service
    container_name: rabbit-admin-service
    ports:
      - "8083:8083"
    environment:
      RABBITMQ_ADDRESSES: rabbitmq:5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "4200:80"
    depends_on:
      - pedidos-service
      - catalogo-service

volumes:
  pgdata:
  rabbitmq-data:
