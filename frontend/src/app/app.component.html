<header class="nav">
  <strong>Pedidos360</strong>
  @if (auth.isLoggedIn()) {
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/orders" routerLinkActive="active">Pedidos</a>
    <a routerLink="/catalog" routerLinkActive="active">Catálogo</a>
    <span class="spacer"></span>
    <span>{{ auth.getUserName() }} <em class="badge">{{ auth.getRoles().join(', ') || 'sin rol asignado' }}</em></span>
    <button (click)="auth.logout()">Cerrar sesión</button>
  } @else {
    <span class="spacer"></span>
    <a routerLink="/login">Login</a>
  }
</header>
<main>
  <router-outlet></router-outlet>
</main>
