# Kafka UI para administrar brokers, topicos y consumer groups (EP5/EP6).
# Requisitos: la red  pedidos360-net  y el cluster de docker-compose-kafka.yml ya levantado.
# Acceso: http://localhost:8090

services:
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    networks: [pedidos360-net]
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29093,kafka3:29094
      KAFKA_CLUSTERS_0_ZOOKEEPER: zoo1:2181,zoo2:2181,zoo3:2181
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_OPTS: "-Xms128m -Xmx384m"

networks:
  pedidos360-net:
    external: true
